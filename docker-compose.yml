version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mih
      POSTGRES_USER: mih
      POSTGRES_PASSWORD: mih
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  cms:
    image: directus/directus:latest
    depends_on:
      - db
    environment:
      KEY: "change-me"
      SECRET: "change-me"
      DB_CLIENT: "pg"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_DATABASE: "mih"
      DB_USER: "mih"
      DB_PASSWORD: "mih"
      ADMIN_EMAIL: "hr@company.com"
      ADMIN_PASSWORD: "ChangeMe123!"
      PUBLIC_URL: "http://localhost:8055"
    ports:
      - "8055:8055"
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions

volumes:
  db_data:
  directus_uploads:
  directus_extensions:
